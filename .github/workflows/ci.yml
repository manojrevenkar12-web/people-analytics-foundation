name: ci

on:
  push:
  pull_request:

jobs:
  platform:
    name: platform, study and reports
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Lint and types
        run: ruff check . && ruff format --check . && mypy src
      - name: Held-out lock committed once
        run: |
          if [ -f reports/heldout.lock ]; then
            n=$(git log --format=%H -- reports/heldout.lock | wc -l)
            echo "commits touching the lock: $n"; test "$n" -le 1
          fi
      - name: Development study, gates and generated files
        if: matrix.python == '3.13'
        run: |
          python -m paf.cli run dev
          python -m paf.cli gate dev
          python -m paf.cli report
          git diff --stat
          git diff --exit-code -- reports/dev.json REPORT.md README.md web/public/data/report.json bi/

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
